modLoader = "javafml"
loaderVersion = "[1,)"
license = "${license}"
issueTrackerURL = "${issueTracker}"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "${displayName}"
displayURL = "${displayUrl}"
bannerFile = "${modId}_logo.png"
authors = "${authors}"
description = "${description}"
# enumExtensions = "META-INF/enum_extensions.json"

[[mixins]]
config = "${modId}.mixins.json"

[[mixins]]
config = "${modId}-platform.neoforged.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies."${modId}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforgeVersion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${modId}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft}]"
ordering = "NONE"
side = "BOTH"

[[dependencies."${modId}"]]
modId = "akythera"
type = "required"
# The "-alpha" lower bound admits prerelease builds (e.g., 0.1.0-SNAPSHOT),
# which Maven version ordering places below the plain release version
versionRange = "[${akytheraVersion}-alpha,)"
ordering = "AFTER"
side = "BOTH"